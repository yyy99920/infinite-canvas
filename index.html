<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151617"><title>FRAME · 无限创作画布</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><button class="brand" id="home" aria-label="适应画布"><span class="brand-mark">f</span><span>FRAME<span class="brand-dot">.</span></span></button><span class="top-divider"></span><div class="project"><span class="workspace-label">个人工作空间 <span>/</span></span><input id="project-name" aria-label="项目名称" value="旷野来信 · 灵感探索" maxlength="60"><span class="project-tag">画布</span></div><div class="top-actions"><span id="save-state"><i></i> 已保存到本机</span><button class="button quiet" id="help" title="操作指南">?</button><button class="button secondary" id="export"><span data-icon="export"></span>导出项目</button><button class="button primary" id="new-board"><span data-icon="plus"></span>新建画布</button><span class="avatar">Y</span></div></header>
<nav class="rail" aria-label="工作空间导航"><button class="rail-button active" id="library-toggle" title="素材与图层" aria-label="素材与图层"><span data-icon="grid"></span></button><button class="rail-button" id="quick-image" title="导入图片" aria-label="导入图片"><span data-icon="image"></span></button><button class="rail-button" id="open-project" title="打开项目文件" aria-label="打开项目文件"><span data-icon="folder"></span></button><div class="rail-bottom"><span class="local-dot"></span><button class="rail-button" id="rail-help" title="快捷键" aria-label="快捷键"><span data-icon="keyboard"></span></button></div></nav>
<aside class="library" id="library"><div class="library-heading"><h2>创作空间</h2><button class="icon-button" id="collapse-library" aria-label="收起侧栏"><span data-icon="sidebar"></span></button></div><div class="tabs"><button class="tab active" data-tab="assets">素材</button><button class="tab" data-tab="layers">图层 <span id="layer-count">6</span></button></div><div class="search"><span data-icon="search"></span><input id="asset-search" placeholder="搜索素材或图层" aria-label="搜索素材或图层"><kbd>⌘ K</kbd></div><section id="assets-content"><div class="section-label">从一个想法开始</div><div class="create-grid"><button data-add="script" class="script-create-tile"><span class="colored-icon purple" data-icon="note"></span><span>脚本编辑器</span><small>分镜脚本与时长</small></button><button data-add="text"><span class="colored-icon purple" data-icon="text"></span><span>文字卡片</span><small>记录灵感与提示词</small></button><button data-add="note"><span class="colored-icon yellow" data-icon="note"></span><span>便签</span><small>随手捕捉好点子</small></button><button id="upload-tile"><span class="colored-icon blue" data-icon="image"></span><span>上传图片</span><small>JPG、PNG、WebP</small></button><button data-add="frame"><span class="colored-icon green" data-icon="frame"></span><span>分组画框</span><small>让创作井然有序</small></button></div><div class="section-label asset-heading">灵感素材 <span>3</span></div><div id="asset-list"></div><button class="upload-area" id="upload-area"><span data-icon="upload"></span><span>点击上传，或拖入画布</span><small>你的素材，只保存在本机</small></button><div class="sidebar-foot"><span class="tiny-spark">✦</span><p>好想法，不必按顺序发生。<br><span>在画布上，自由连接每一份灵感。</span></p></div></section><section id="layers-content" hidden><div id="layer-list"></div><p class="layer-tip">点击定位图层 · Shift 点击多选</p></section></aside>
<main id="canvas" tabindex="0" aria-label="无限画布"><div class="canvas-title"><div><span class="status-dot"></span> 自由画布 <span class="beta-label">LOCAL</span></div><p>让灵感延伸，让创意发生。</p></div><div id="world"><svg id="connections" aria-label="卡片连接线"></svg><div id="nodes"></div></div><div id="marquee" hidden></div><div id="empty-state" hidden><span>✦</span><h1>从这里，展开你的想法。</h1><p>添加文字、拖入图片，把灵感连成一个世界。</p><button class="button primary" data-add="text">添加第一张卡片</button></div><div class="canvas-hint">双击空白处添加卡片 <span>·</span> 按住 <kbd>空格</kbd> 拖动画布 <span>·</span> <kbd>⌘</kbd> + 滚轮缩放</div><div id="connect-banner" hidden>点击另一张卡片建立连接 <button id="cancel-connect">取消</button></div></main>
<div class="zoom-bar"><button class="icon-button" id="zoom-out" aria-label="缩小"><span data-icon="minus"></span></button><button id="zoom-value" title="重置为 100%">100%</button><button class="icon-button" id="zoom-in" aria-label="放大"><span data-icon="plus"></span></button><span></span><button class="icon-button" id="fit" aria-label="适应全部内容" title="适应全部内容 · Shift 1"><span data-icon="fit"></span></button></div>
<div class="toolbar" role="toolbar" aria-label="画布工具"><button class="tool active" data-tool="select" aria-label="选择工具" title="选择 · V"><span data-icon="cursor"></span></button><button class="tool" data-tool="hand" aria-label="平移工具" title="平移 · H"><span data-icon="hand"></span></button><i></i><button class="tool" data-add="text" aria-label="添加文字" title="文字 · T"><span data-icon="text"></span></button><button class="tool" data-add="note" aria-label="添加便签" title="便签 · N"><span data-icon="note"></span></button><button class="tool" id="toolbar-image" aria-label="添加图片" title="上传图片"><span data-icon="image"></span></button><button class="tool" data-tool="connect" aria-label="连接工具" title="连接 · C"><span data-icon="link"></span></button><button class="tool" data-add="frame" aria-label="添加分组" title="画框 · F"><span data-icon="frame"></span></button><i></i><button class="tool" id="undo" aria-label="撤销" title="撤销 · ⌘ Z"><span data-icon="undo"></span></button><button class="tool" id="redo" aria-label="重做" title="重做 · ⌘ Shift Z"><span data-icon="redo"></span></button></div>
<aside class="minimap" id="minimap"><div><span>画布概览</span><button id="minimap-toggle" aria-label="折叠概览">⌄</button></div><svg id="map" viewBox="0 0 170 94" aria-label="画布缩略图"></svg></aside>
<aside id="selection-panel" hidden><div class="selection-heading"><span id="selection-kind">卡片</span><button class="icon-button" id="deselect" aria-label="取消选择">×</button></div><label>名称<input id="node-title" maxlength="100"></label><div id="note-colors"><span>便签颜色</span><button data-color="sand" aria-label="米色便签"></button><button data-color="sage" aria-label="绿色便签"></button><button data-color="lavender" aria-label="紫色便签"></button></div><div class="selection-actions"><button id="duplicate"><span data-icon="copy"></span>复制</button><button id="connect-selected"><span data-icon="link"></span>连接</button><button id="delete"><span data-icon="trash"></span>删除</button></div><p>双击文字即可编辑</p></aside>
<section id="add-node-menu" role="dialog" aria-label="添加节点" hidden>
  <div class="add-menu-heading"><span id="add-menu-title">添加节点</span><button id="add-menu-close" class="icon-button" aria-label="关闭添加菜单">×</button></div>
  <div class="add-menu-search"><span data-icon="search"></span><input id="node-menu-search" aria-label="搜索卡片类型" placeholder="搜索卡片类型…" autocomplete="off"></div>
  <div id="add-menu-items"></div>
  <div class="add-menu-footer"><span>在此处添加</span><kbd>Esc 关闭</kbd></div>
</section>
<div id="toast" role="status" hidden></div><input type="file" id="script-reference-input" accept="image/png,image/jpeg,image/webp" multiple hidden><input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="project-input" accept="application/json,.json" hidden>
<dialog id="modal"><div id="modal-content"></div></dialog><script type="module" src="app.js"></script>
</body></html>
